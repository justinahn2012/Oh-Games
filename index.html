<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oh Games!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; padding: 24px; text-align: center;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      background: linear-gradient(135deg, #6a5cff, #ff5ca8); color: #fff;
    }
    h1 { font-size: clamp(3rem, 12vw, 6rem); text-shadow: 0 6px 0 rgba(0,0,0,.2); }
    p { font-size: 1.2rem; opacity: .9; }
    .games { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
    a.card {
      display: block; width: 240px; padding: 22px; border-radius: 22px;
      background: #ffffff22; color: #fff; text-decoration: none;
      box-shadow: 0 8px 0 #0002; transition: transform .1s;
    }
    a.card:active { transform: translateY(4px); }
    .emoji { font-size: 3.5rem; }
    .name { font-size: 1.5rem; font-weight: bold; margin-top: 6px; }
    .desc { font-size: .95rem; opacity: .85; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Oh Games! 🎮</h1>
  <p>Pick a game to play</p>
  <div class="games">
    <a class="card" href="city.html">
      <div class="emoji">🏙️</div>
      <div class="name">Rooftop Rascals</div>
      <div class="desc">Explore the city, jump on rooftops, drive cars and dodge the cops!</div>
    </a>
    <a class="card" href="runner.html">
      <div class="emoji">🏃</div>
      <div class="name">Cash Dash</div>
      <div class="desc">Run, dodge, collect cash and upgrade!</div>
    </a>
  </div>
</body>
</html>
